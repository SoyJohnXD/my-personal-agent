[tool.ruff]
target-version = "py313"
line-length = 150

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.ruff.lint]
select = [
    "E",   # Errores de estilo básico (pycodestyle)
    "F",   # Variables sin usar, imports rotos, código muerto (Pyflakes)
    "I",   # Orden automático de imports (isort)
    "B",   # Bugs comunes, malas prácticas (flake8-bugbear)
    "N",   # Convenciones de naming: snake_case, CamelCase (pep8-naming)
    "UP",  # Migración a sintaxis moderna de Python 3.13+ (pyupgrade)
    "SIM", # Simplificar condicionales, reducir anidaciones (flake8-simplify)
    "RET", # Forzar early returns, evitar else innecesarios (flake8-return)
    "ANN", # Exigir type hints en parámetros y retornos (flake8-annotations)
    "ARG", # Detectar argumentos de función que nunca se usan (flake8-unused-arguments)
]

ignore = [
    "ANN401", # Excepción: permitir `Any` como type hint mientras migramos el código
    "N806",   # Excepción: permitir CONSTANTES_EN_MAYUSCULAS dentro de funciones
    "E501",   # Excepción: ignorar líneas largas; el formateo automático se encarga
]

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"